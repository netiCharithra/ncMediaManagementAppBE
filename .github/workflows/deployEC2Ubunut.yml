name: Deploy to EC2

on:
  push:
    branches:
      - main_v3  # change if using another branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UBUNTU_EC2_HOST }}
          username: ${{ secrets.UBUNTU_EC2_USER }}
          key: ${{ secrets.UBUNTU_EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ncMediaManagementAppBE
            git pull origin main_v3
            npm install --production

            # Create .env file from GitHub secrets
            cat > .env << EOF
            BUCKET_REGION=${{ secrets.AWS_REGION }}
            ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}
            SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            BUCKET_NAME_ARTICLE=${{ secrets.BUCKET_NAME_ARTICLE }}
            BUCKET_NAME_EMPLOYEE_DOCS=${{ secrets.BUCKET_NAME_EMPLOYEE_DOCS }}
            MONGO_DB_URL=${{ secrets.MONGO_DB_URL }}
            NODE_ENV=production
            EOF

            echo "Environment variables set. Restarting PM2..."
            pm2 restart all
