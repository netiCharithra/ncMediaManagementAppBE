name: Deploy Viva Digital News Backend to EC2

on:
  push:
    branches:
      - viva_digital_backend_bkp

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying VivaDigitalNews Backend..."
            mkdir -p /home/ec2-user/projects/ViVaDigitalNews/backend
            cd /home/ec2-user/projects/ViVaDigitalNews/backend
            
            echo "Current directory: $(pwd)"
            
            if [ ! -d ".git" ]; then
              echo "Initializing Git tracking to ncMediaManagementAppBE repo..."
              git init
              git remote add origin https://github.com/netiCharithra/ncMediaManagementAppBE.git
              git fetch origin viva_digital_backend
              git checkout -b viva_digital_backend origin/viva_digital_backend
            else
              git config pull.rebase false
              git checkout -- package-lock.json
              git pull origin viva_digital_backend
            fi
            
            echo "Installing dependencies and building bundle..."
            npm install
            npm run build
            
            # Optional: Prune to keep only production deps on disk, 
            # though bundles are mostly self-contained.
            npm prune --production
            
            echo "Setting up environment variables..."
            cat > .env << EOF
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            VIVA_DIGITAL_MONGO_URI=${{ secrets.VIVA_DIGITAL_MONGO_URI }}
            VIVA_DIGITAL_JWT_SECRET=${{ secrets.VIVA_DIGITAL_JWT_SECRET }}
            VIVA_DIGITAL_JWT_EXPIRES_IN=${{ secrets.VIVA_DIGITAL_JWT_EXPIRES_IN }}
            VIVA_DIGITAL_JWT_REFRESH_SECRET=${{ secrets.VIVA_DIGITAL_JWT_REFRESH_SECRET }}
            VIVA_DIGITAL_JWT_REFRESH_EXPIRES_IN=${{ secrets.VIVA_DIGITAL_JWT_REFRESH_EXPIRES_IN }}
            VIVA_DIGITAL_REDIS_HOST=${{ secrets.VIVA_DIGITAL_REDIS_HOST }}
            VIVA_DIGITAL_REDIS_PORT=${{ secrets.VIVA_DIGITAL_REDIS_PORT }}
            VIVA_DIGITAL_REDIS_PASSWORD=${{ secrets.VIVA_DIGITAL_REDIS_PASSWORD }}
            VIVA_DIGITAL_FIREBASE_PROJECT_ID=${{ secrets.VIVA_DIGITAL_FIREBASE_PROJECT_ID }}
            VIVA_DIGITAL_FIREBASE_PRIVATE_KEY_ID=${{ secrets.VIVA_DIGITAL_FIREBASE_PRIVATE_KEY_ID }}
            VIVA_DIGITAL_FIREBASE_PRIVATE_KEY="${{ secrets.VIVA_DIGITAL_FIREBASE_PRIVATE_KEY }}"
            VIVA_DIGITAL_FIREBASE_CLIENT_EMAIL=${{ secrets.VIVA_DIGITAL_FIREBASE_CLIENT_EMAIL }}
            VIVA_DIGITAL_FIREBASE_CLIENT_ID=${{ secrets.VIVA_DIGITAL_FIREBASE_CLIENT_ID }}
            VIVA_DIGITAL_FIREBASE_DATABASE_URL=${{ secrets.VIVA_DIGITAL_FIREBASE_DATABASE_URL }}
            VIVA_DIGITAL_ADMIN_EMAIL=${{ secrets.VIVA_DIGITAL_ADMIN_EMAIL }}
            VIVA_DIGITAL_ADMIN_PASSWORD=${{ secrets.VIVA_DIGITAL_ADMIN_PASSWORD }}
            VIVA_DIGITAL_GOOGLE_TRANSLATE_API_KEY=${{ secrets.VIVA_DIGITAL_GOOGLE_TRANSLATE_API_KEY }}
            VIVA_DIGITAL_GROQ_API_KEY=${{ secrets.VIVA_DIGITAL_GROQ_API_KEY }}
            VIVA_DIGITAL_R2_ACCESS_KEY_ID=${{ secrets.VIVA_DIGITAL_R2_ACCESS_KEY_ID }}
            VIVA_DIGITAL_R2_SECRET_ACCESS_KEY=${{ secrets.VIVA_DIGITAL_R2_SECRET_ACCESS_KEY }}
            VIVA_DIGITAL_R2_ENDPOINT=${{ secrets.VIVA_DIGITAL_R2_ENDPOINT }}
            VIVA_DIGITAL_R2_BUCKET_NAME=${{ secrets.VIVA_DIGITAL_R2_BUCKET_NAME }}
            VIVA_DIGITAL_R2_PUBLIC_URL=${{ secrets.VIVA_DIGITAL_R2_PUBLIC_URL }}
            VIVA_DIGITAL_GEMINI_API_KEY=${{ secrets.VIVA_DIGITAL_GEMINI_API_KEY }}
            VIVA_DIGITAL_HF_TOKEN=${{ secrets.VIVA_DIGITAL_HF_TOKEN }}
            VIVA_DIGITAL_GOOGLE_APPLICATION_CREDENTIALS=/home/ec2-user/projects/ViVaDigitalNews/backend/gcp-logging-key.json
            VIVA_DIGITAL_IMAGE_WORKER_BATCH_SIZE=4
            VIVA_DIGITAL_LOG_LEVEL=info
            VIVA_DIGITAL_PAUSE_GCP_LOGGING=false
            PAUSE_GCP_LOGGING=false
            EOF
            
            echo "Environment variables set. Restarting PM2 processes..."

            # Restart the API process using the BUNDLED file directly
            pm2 delete viva-digital-news-api || true
            pm2 start dist/server.js --name "viva-digital-news-api" --node-args="-r dotenv/config"
            pm2 save || true
            
            echo "Deployment Complete! 🚀"
